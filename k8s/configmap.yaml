apiVersion: v1
kind: ConfigMap
metadata:
  name: claimguard-config
  labels:
    app: claimguard
data:
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "claimguard"
  POLICY_BASE_URL: "http://policy:8000"
  POLICY_HTTP_TIMEOUT_SECONDS: "3"
  POLICY_MAX_CLAIM_EUR: "500.00"
  POLICY_MAX_MEALS_EUR: "80.00"
  POLICY_MAX_OTHER_EUR: "25.00"
